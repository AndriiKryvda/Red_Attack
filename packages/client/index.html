<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RED ATTACK — FPV Drone Defense</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
    #game-canvas { width: 100vw; height: 100vh; display: block; }
    #hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #hud .hp-bar { position: absolute; top: 20px; left: 20px; width: 200px; height: 20px; background: #333; border: 2px solid #fff; border-radius: 4px; }
    #hud .hp-bar .hp-fill { height: 100%; background: #4caf50; transition: width 0.3s; border-radius: 2px; }
    #hud .hp-label { position: absolute; top: 44px; left: 20px; color: #fff; font-size: 12px; }
    #hud .wave-info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 18px; text-align: center; }
    #hud .drone-status { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 14px; text-align: right; }
    #hud .score { position: absolute; top: 50px; right: 20px; color: #ffd700; font-size: 16px; }
    #hud .announcement { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; font-size: 48px; font-weight: bold; text-shadow: 2px 2px 4px #000; opacity: 0; transition: opacity 0.5s; }
    #hud .announcement.show { opacity: 1; }
    #hud .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.7); border-radius: 50%; display: none; }
    #hud .crosshair.show { display: block; }
    #hud .room-code { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #aaa; font-size: 13px; letter-spacing: 2px; }
    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
    #overlay.hidden { display: none; }
    #overlay .menu { text-align: center; color: #fff; }
    #overlay .menu h1 { font-size: 48px; color: #ff4444; margin-bottom: 10px; }
    #overlay .menu p { font-size: 18px; margin-bottom: 30px; color: #aaa; }
    #overlay .menu input { padding: 10px 20px; font-size: 16px; border: 2px solid #555; background: #222; color: #fff; border-radius: 4px; margin-bottom: 15px; width: 250px; }
    #overlay .menu button { padding: 12px 30px; font-size: 18px; background: #ff4444; color: #fff; border: none; border-radius: 4px; cursor: pointer; pointer-events: all; }
    #overlay .menu button:hover { background: #ff6666; }
    #overlay .menu .controls { margin-top: 20px; font-size: 13px; color: #888; line-height: 1.8; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="hud">
    <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
    <div class="hp-label" id="hp-label">Outpost: 100/100</div>
    <div class="wave-info" id="wave-info">Wave 1 / 12</div>
    <div class="drone-status" id="drone-status">Press SPACE to launch</div>
    <div class="score" id="score-display">Score: 0</div>
    <div class="room-code" id="room-code-display"></div>
    <div class="announcement" id="announcement"></div>
    <div class="crosshair" id="crosshair"></div>
  </div>
  <div id="overlay">
    <div class="menu">
      <h1>🔴 RED ATTACK</h1>
      <p>FPV Drone Defense</p>
      <input type="text" id="player-name" placeholder="Your callsign" maxlength="16" />
      <br/>
      <input type="text" id="room-code" placeholder="Room code (optional)" maxlength="6" style="text-transform:uppercase" />
      <br/>
      <button id="btn-start">CREATE GAME</button>
      <button id="btn-join" style="margin-left:10px;background:#4caf50">JOIN GAME</button>
      <div class="controls">
        <strong>Controls:</strong><br/>
        W/A/S/D — Move | Mouse — Look | Space — Launch/Up<br/>
        Shift — Down | LMB — Boost | R — Self-destruct
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
